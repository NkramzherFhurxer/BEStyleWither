
name: Test BE Style Wither - Fabric 26.3

on:
  push:
    branches:
      - fabric-26.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Allow Gradle execution
        run: chmod +x ./gradlew

      - name: Build Fabric mod
        run: ./gradlew :fabric:build --stacktrace --no-daemon
        
      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: BEStyleWither-Fabric-26.3
          path: fabric/build/libs/*.jar
          if-no-files-found: error

