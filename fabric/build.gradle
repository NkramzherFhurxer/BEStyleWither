
plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    implementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }

    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    implementation "me.shedaniel.cloth:cloth-config-fabric:26.3.159"

    implementation "com.terraformersmc:modmenu:21.0.0"
}

tasks.named('processResources') {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.named('jar') {
    archiveClassifier.set('dev')
}

tasks.named('shadowJar') {
    configurations = [project.configurations.shadowBundle]

    archiveClassifier.set('')
    archiveBaseName.set("${rootProject.mod_id}-fabric-mc${rootProject.minecraft_version}")
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
